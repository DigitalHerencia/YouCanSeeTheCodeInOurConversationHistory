:root{--bg:#05030b;--panel:#0c0b11;--panel2:#111018;--border:#26232f;--text:#f6f6f7;--muted:#9996a3;--accent:#2f7a8d;--good:#3aa675;--warn:#d2a84a;--bad:#c75a5a;--merge:#7467b7}*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{margin:0;background:var(--bg)}button,input,textarea,select{font:inherit}header{position:sticky;top:0;z-index:5;background:rgba(5,3,11,.96);border-bottom:1px solid var(--border);padding:18px 20px}.brand{font-family:Copperplate,"Copperplate Gothic Bold",Georgia,serif;text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:18px;text-shadow:0 0 16px rgba(47,122,141,.45)}.sub{color:var(--muted);font-size:12px;margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}nav button{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 11px;cursor:pointer}nav button.active{color:white;border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}main{max-width:1200px;margin:0 auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);padding:16px}.card h3,.card h4{margin:0 0 8px}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--border);padding:14px}.kpi strong{display:block;font-size:24px;color:white}.kpi span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--border);color:white;padding:9px 10px}.toolbar input{min-width:260px;flex:1}.item{background:var(--panel);border:1px solid var(--border);padding:14px;margin:10px 0}.item-head{display:flex;gap:10px;justify-content:space-between;align-it ual reasoning", "owner": "Vibes / Schemes depending on content", "roles": ["Vibes", "Schemes", "DevNotes", "Ivan"], "rule": "Use for relationships that are easier to understand spatially."}, {"name": "Git", "purpose": "Provenance and durable version history", "owner": "DevNotes infrastructure; GitHub owns live repository execution state", "roles": ["All roles"], "rule": "Git history is provenance; do not confuse repository execution state with DevNotes project state."}], "sections": [{"id": "identity", "name": "System Identity & Principles", "summary": "What DevNotes is, what ChatGPT is, what Codependent Coding governs, and which invariants define the whole system."}, {"id": "roles", "name": "Role Model & Ownership", "summary": "Eight ChatGPT roles as bounded contexts, plus Ivan’s personal creative context and shared coordination infrastructure."}, {"id": "knowledge", "name": "Knowledge Model", "summary": "Epistemology, ontology, terminology, taxonomy, topology, schemas, provenance and the rest of the shared reasoning grammar."}, {"id": "ia", "name": "Information Architecture", "summary": "Root topology, role folders, workspaces, Canon/Reference/Archive, personal folder and shared message board."}, {"id": "metadata", "name": "Properties, Tags & State", "summary": "Classification versus mutable state, relationship semantics and what the human should never have to edit manually."}, {"id": "graph", "name": "Knowledge Graph & Provenance", "summary": "Wikilinks, backlinks, typed relationships, source authority and durable context."}, {"id": "templates", "name": "Artifact & Template System", "summary": "Governance docs, specifications, product/business artifacts, operational notes and role-specific creation."}, {"id": "work", "name": "Project & Task Management", "summary": "Chief of Staff ownership, TaskNotes/Kanban, roadmaps, OKRs, GitHub Projects v2 and software execution handoff."}, {"id": "dashboards", "name": "Hearth Dashboards", "summary": "Global control room and r otes"], "recommended": "keep", "kind": "core", "source": "Conversation + current authority", "conflict": ""}, {"id": "migration-05", "section": "migration", "title": "Canonical docs update only after evidence", "description": "README, AGENTS and system contracts are updated after the implemented UX has been validated rather than before.", "layers": ["Governance", "DevNotes"], "roles": ["DevNotes", "Trust Issues"], "recommended": "keep", "kind": "core", "source": "Conversation + current authority", "conflict": ""}], "softwareTerms": [{"term": "Role", "definition": "The responsibility something performs in the system; what it is there to do."}, {"term": "Responsibility", "definition": "The specific work or decisions owned by a role, component, or module."}, {"term": "Boundary", "definition": "The separation between concerns, systems, trust levels, or ownership areas; defines what may cross and how."}, {"term": "Constraint", "definition": "A rule limiting what is permitted, required, or structurally possible."}, {"term": "Invariant", "definition": "A condition that must remain true regardless of the operation being performed."}, {"term": "Contract", "definition": "An explicit agreement describing inputs, outputs, guarantees, errors, and obligations between parts of a system."}, {"term": "Interface", "definition": "The exposed surface through which something is used, without requiring callers to know its internals."}, {"term": "Module", "definition": "A cohesive implementation unit that encapsulates related behavior and exposes a controlled interface."}, {"term": "Component", "definition": "A replaceable or composable system part with a defined responsibility; in Codependent Coding, preserve the distinction between generic industry terminology and Simples constitution."}, {"term": "Layer", "definition": "A grouping of responsibilities at a particular abstraction level, usually with controlled dependency direction."}, {"term": "Abstraction", "definition": "A simplified model that exposes relevant behavior while hiding unnecessary implementation details."}, {"term": "Concern", "definition": "A distinct area of responsibility."}, {"term": "Separation of concerns", "definition": "Dividing responsibilities so unrelated concerns do not become entangled."}, {"term": "Domain", "definition": "The technology-agnostic subject area or IRL business activity the software represents."}, {"term": "Domain model", "definition": "The software representation of the domain’s concepts, relationships, rules, states, and invariants."}, {"term": "Entity", "definition": "A domain object defined primarily by persistent identity across time and state changes."}, {"term": "Value object", "definition": "A domain object defined by its values rather than identity, usually immutable."}, {"term": "Aggregate", "definition": "A cluster of domain objects treated as one consistency boundary."}, {"term": "Relationship", "definition": "A meaningful association between entities or concepts."}, {"term": "Schema", "definition": "A formal definition of valid structure, fields, types, relationships, or input shape."}, {"term": "Record", "definition": "A concrete stored representation of data."}, {"term": "DTO", "definition": "A deliberately constrained object used to transport data across a boundary."}, {"term": "Projection", "definition": "A selected subset or transformed view of a larger data model."}, {"term": "Mapper", "definition": "Code that translates one representation into another."}, {"term": "State", "definition": "The currently stored or observable condition of an entity or system."}, {"term": "Transition", "definition": "A permitted change from one state to another."}, {"term": "Lifecycle", "definition": "The complete sequence of states and transitions something may experience."}, {"term": "Workflow", "definition": "A coordinated application use case that sequences authorization, rules, persistence, providers, and outcomes."}, {"term": "Operation", "definition": "A discrete action performed by or upon a system element."}, {"term": "Command", "definition": "A request to change state."}, {"term": "Query", "definition": "A request to retrieve information without changing authoritative state."}, {"term": "Side effect", "definition": "An observable consequence beyond returning a value."}, {"term": "Idempotency", "definition": "Repeating the same logical operation does not create additional unintended effects."}, {"term": "Reconciliation", "definition": "Comparing local state with an authoritative external source and resolving differences."}, {"term": "Architecture", "definition": "The significant structure of a system: elements, responsibilities, relationships, boundaries, and governing decisions."}, {"term": "Pattern", "definition": "A named, reusable solution structure for a recurring problem in a defined context."}, {"term": "Convention", "definition": "A standardized choice followed consistently to eliminate unnecessary decisions."}, {"term": "Topology", "definition": "The arrangement and connections among system elements."}, {"term": "Dependency", "definition": "A relationship where one element requires another to perform its responsibility."}, {"term": "Dependency direction", "definition": "The permitted direction in which system elements may know about or call one another."}, {"term": "Orchestration", "definition": "Coordinating several components or operations to complete a larger use case."}, {"term": "Composition / Constitution", "definition": "Industry terminology may use composition; Codependent Coding’s branded doctrine treats systems and Workflows as constituted relationships."}, {"term": "Encapsulation", "definition": "Keeping internal state and implementation hidden behind a controlled interface."}, {"term": "Coupling", "definition": "The degree to which one part depends on the details of another."}, {"term": "Cohesion", "definition": "How strongly the responsibilities inside a module belong together."}, {"term": "Infrastructure", "definition": "Runtime resources that support the application."}, {"term": "Tooling", "definition": "Development-time tools used to build, validate, test, deploy, or operate the system."}, {"term": "Integration", "definition": "A controlled connection between the application and another system or provider."}, {"term": "Provider", "definition": "An external service supplying capabilities."}, {"term": "Adapter", "definition": "A boundary module translating between application concepts and another system’s interface."}, {"term": "API", "definition": "A defined interface through which software systems or modules communicate."}, {"term": "Webhook", "definition": "A provider-initiated HTTP notification reporting external state/event change."}, {"term": "Runtime", "definition": "The environment and period in which the application executes."}, {"term": "Deployment", "definition": "A runnable release installed in a target environment."}, {"term": "Environment", "definition": "A configured execution context such as development, preview, test, or production."}, {"term": "Authentication", "definition": "Establishing who or what is making a request."}, {"term": "Authorization", "definition": "Deciding what an authenticated actor may do in a particular context."}, {"term": "Actor", "definition": "A trusted representation of the user, system, provider, or process attempting an operation."}, {"term": "Capability", "definition": "A stable name for a class of action an actor may be permitted to perform."}, {"term": "Policy", "definition": "Logic that decides whether an operation is allowed under specific facts."}, {"term": "Trust boundary", "definition": "A point where data or control crosses different levels or sources of trust."}, {"term": "Source of truth", "definition": "The authority whose state is considered canonical for a specific fact."}, {"term": "Validation", "definition": "Determining whether untrusted input satisfies schema and semantic rules."}, {"term": "Sanitization", "definition": "Removing, escaping, or normalizing unsafe or unwanted input content."}, {"term": "Tenant", "definition": "The architectural ownership and isolation boundary for a customer organization or equivalent account."}, {"term": "Specification", "definition": "A precise description of required behavior, structure, interfaces, and acceptance conditions."}, {"term": "Governance", "definition": "Rules and processes controlling how a system is designed, changed, validated, and maintained."}, {"term": "Enforcement", "definition": "The mechanism that detects, rejects, or prevents violations of a rule."}, {"term": "Quality gate", "definition": "A required validation checkpoint that must pass before work proceeds."}, {"term": "Static analysis", "definition": "Examining source code without executing it to identify violations or defects."}, {"term": "Test", "definition": "Executable evidence that behavior or an invariant holds under specified conditions."}, {"term": "Observability", "definition": "Understanding internal behavior through logs, metrics, traces and operational state."}, {"term": "Audit event", "definition": "A durable record of a significant action, decision, actor, and outcome."}, {"term": "Artifact", "definition": "Any durable engineering output: code, specification, contract, test, migration, diagram, etc."}], "layers": [{"name": "ChatGPT Roles", "description": "The active responsibility interfaces that reason and execute."}, {"name": "DevNotes", "description": "The durable knowledge, state and Obsidian workbench layer."}, {"name": "Codependent Coding / TypeScripture", "description": "Canonical engineering doctrine, vocabulary, patterns and branded architecture."}, {"name": "Software / System Terminology", "description": "Industry-standard engineering language used when it is the correct term."}, {"name": "Obsidian Implementation", "description": "Hearth, Bases, Meta Bind, toolbars, templates, tasks, callouts, Code Space and Git."}, {"name": "Orchestration", "description": "Chief-of-Staff lifecycle, Scrum/Agile-inspired handoffs and GitHub execution state."}, {"name": "Compiled Interface", "description": "The reconciled role manifest becomes both a Hearth dashboard and future ChatGPT thread launcher."}], "shared": {"messageBoard": {"name": "Interproject Message Board", "ownership": "Prömpter defines grammar · Chief of Staff owns traffic/state · receiving role owns next work · DevNotes preserves durable knowledge", "behavior": ["Read newest message addressed to role or ALL", "Perform requested action inside existing role", "Produce standard handoff when responsibility changes", "Do not make the user relay context already recorded"]}, "systemGrammar": "Roles own responsibilities. Modules implement roles. Interfaces expose modules. Contracts govern interfaces. Boundaries separate concerns. Constraints and invariants limit behavior. Patterns provide repeatable implementations. Evidence establishes conformance.", "codependent": "A system for turning codebases into context and context into meaning."}}</script>
<script>
(function(){
const model=JSON.parse(document.getElementById('model').textContent), KEY='devnotes-reconciliation-simple-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let view='overview',section='all',search='',role=model.roles[0].name;const app=document.getElementById('app'),nav=document.getElementById('nav');
const views=[['overview','Overview'],['reconcile','Reconcile'],['roles','Role Dashboard'],['reference','Reference'],['export','Export']];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=id=>saved[id]||{status:'undecided',note:''};
function setDec(id,status,note){saved[id]={status:status||dec(id).status,note:note==null?dec(id).note:note};localStorage.setItem(KEY,JSON.stringify(saved));render()}
const count=s=>model.items.filter(x=>dec(x.id).status===s).length;
function renderNav(){nav.innerHTML=views.map(v=>`<button data-view="${v[0]}" class="${view===v[0]?'active':''}">${v[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function overview(){const stats=[['Decisions',model.items.length],['Undecided',count('undecided')],['Keep',count('keep')],['Modify',count('modify')],['Merge',count('merge')],['Reject',count('reject')]];return `<div class="kpis">${stats.map(x=>`<div class="kpi"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><div class="card"><h3>What this is for</h3><p class="desc">Resolve the DevNotes design one decision at a time. The full role, TypeScripture, template, plugin and terminology model is preserved underneath; this screen is intentionally small.</p></div><h2 class="section-title">Sections</h2><div class="grid">${model.sections.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.summary)}</p><div class="meta">${model.items.filter(i=>i.section===s.id).length} decisions · ${model.items.filter(i=>i.section===s.id&&dec(i.id).status==='undecided').length} unresolved</div><div class="actions" style="margin-top:12px"><button data-open-section="${s.id}">Open</button></div></div>`).join('')}</div>`}
function reconcile(){let items=model.items.filter(i=>section==='all'||i.section===section);if(search.trim()){const q=search.toLowerCase();items=items.filter(i=>JSON.stringify(i).toLowerCase().includes(q))}return `<div class="toolbar"><select id="sectionFilter"><option value="all">All sections</option>${model.sections.map(s=>`<option value="${s.id}" ${section===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><input id="searchBox" placeholder="Search decisions, roles, plugins, terms…" value="${esc(search)}"></div>${items.map(i=>{const d=dec(i.id),sn=model.sections.find(s=>s.id===i.section);return `<div class="item"><div class="item-head"><div><h3>${esc(i.title)}</h3><div class="meta">${esc(sn?sn.name:i.section)} · source recommendation: ${esc(i.recommended)} · ${esc(i.kind)}</div></div></div><div class="desc">${esc(i.description)}</div>${i.roles&&i.roles.length?`<div>${i.roles.map(r=>`<span class="badge">${esc(r)}</span>`).join('')}</div>`:''}${i.conflict?`<div class="meta" style="color:#d2a84a;margin-top:8px">Conflict: ${esc(i.conflict)}</div>`:''}<div class="statuses">${['undecided','keep','modify','merge','reject'].map(s=>`<button data-id="${i.id}" data-s="${s}" class="${d.status===s?'sel':''}">${s}</button>`).join('')}</div><textarea data-note="${i.id}" placeholder="Why? What changes? What should survive?">${esc(d.note)}</textarea></div>`}).join('')||'<div class="empty">No matching decisions.</div>'}`}
function roles(){const r=model.roles.find(x=>x.name===role)||model.roles[0],related=model.items.filter(i=>(i.roles||[]).includes(r.name)),unresolved=related.filter(i=>dec(i.id).status==='undecided').length;const list=(title,arr)=>`<div class="card"><h3>${esc(title)}</h3><ul>${(arr||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return `<select class="role-select" id="roleSelect">${model.roles.map(x=>`<option ${x.name===r.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="card"><h2 style="margin-top:0">${esc(r.name)}</h2><div class="accent">${esc(r.formalRole)}</div><p class="desc">${esc(r.coreQuestion)}</p><div class="meta">${related.length} related decisions · ${unresolved} unresolved</div></div><h2 class="section-title">Compiled dashboard definition</h2><div class="columns">${list('Dashboard blocks',r.dashboard)}${list('Templates',r.templates)}${list('Notes / artifacts',r.noteKinds)}${list('Owns',r.owns)}${list('Codependent Coding / knowledge',r.knowledge)}${list('Software terminology',r.software)}${list('Obsidian plugins',r.plugins)}${list('Future ChatGPT launcher',r.launcher)}</div>`}
function reference(){return `<h2 class="section-title">Knowledge model</h2><div class="grid">${model.knowledge.map(k=>`<div class="card"><h3>${esc(k.term)}</h3><div class="accent">${esc(k.owner)}</div><p class="desc">${esc(k.question)}</p><div class="meta">TypeScripture: ${esc(k.typescripture)}</div></div>`).join('')}</div><h2 class="section-title">Obsidian plugins</h2><div class="grid">${model.plugins.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="desc">${esc(p.purpose)}</p><div class="meta">${esc(p.rule)}</div></div>`).join('')}</div><h2 class="section-title">Software / systems terminology</h2><div class="grid">${model.softwareTerms.map(t=>`<div class="card"><h3>${esc(t.term)}</h3><p class="muted">${esc(t.definition)}</p></div>`).join('')}</div>`}
function exporter(){return `<div class="card"><h3>Export / reset</h3><p class="desc">Download your decisions as JSON, or reset only the local reconciliation state. The source model is untouched.</p><div class="actions"><button id="download">Download decisions JSON</button><button id="reset">Reset decisions</button></div><pre style="white-space:pre-wrap;color:var(--muted);font-size:11px;margin-top:16px">${esc(JSON.stringify({total:model.items.length,undecided:count('undecided'),keep:count('keep'),modify:count('modify'),merge:count('merge'),reject:count('reject')},null,2))}</pre></div>`}
function render(){renderNav();app.innerHTML=view==='overview'?overview():view==='reconcile'?reconcile():view==='roles'?roles():view==='reference'?reference():exporter();bind()}
function bind(){app.querySelectorAll('[data-open-section]').forEach(b=>b.onclick=()=>{section=b.dataset.openSection;view='reconcile';render()});const sf=document.getElementById('sectionFilter');if(sf)sf.onchange=e=>{section=e.target.value;render()};const sb=document.getElementById('searchBox');if(sb)sb.onchange=e=>{search=e.target.value;render()};app.querySelectorAll('.statuses button').forEach(b=>b.onclick=()=>setDec(b.dataset.id,b.dataset.s));app.querySelectorAll('textarea[data-note]').forEach(t=>t.onchange=()=>setDec(t.dataset.note,null,t.value));const rs=document.getElementById('roleSelect');if(rs)rs.onchange=e=>{role=e.target.value;render()};const dl=document.getElementById('download');if(dl)dl.onclick=()=>{const blob=new Blob([JSON.stringify({meta:model.meta,decisions:saved},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='devnotes-reconciliation-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Reset all reconciliation decisions in this browser?')){saved={};localStorage.removeItem(KEY);render()}}}
render();
})();
</script></body></html>
