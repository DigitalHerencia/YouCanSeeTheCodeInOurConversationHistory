schema_version: "1.0"
source_kind: "ai_alignment_contract"
project:
  name: "MeatHarness"
  repository: "DigitalHerencia/MeatHarness"
  repository_visibility: "private"
  primary_language: "TypeScript"
  runtime: "Node.js"
  ui_framework: "Ink"
  package_manager: "pnpm"
  product_type: "terminal_ui_operator_harness"

mission:
  summary: >
    Maintain and evolve MeatHarness as a PowerShell-friendly TypeScript/Ink
    operator harness with clean terminal UI architecture, predictable keyboard
    navigation, explicit state transitions, and safe repo-aware execution.
  success_definition:
    - "The TUI remains easy to navigate and reason about."
    - "State transitions are explicit and typed."
    - "CLI boundaries stay thin."
    - "Screen components stay compositional."
    - "Utilities isolate filesystem, repo, script, markdown, and process concerns."
    - "Changes are validated with the repo's actual package scripts."

verified_repo_anchors:
  root:
    - "README.md"
    - "package.json"
    - "pnpm-lock.yaml"
    - "tsconfig.json"
    - ".agent-logs/events.jsonl"
  entrypoints:
    - "src/cli.ts"
    - "src/app.tsx"
  state:
    - "src/state/useMeatHarnessController.ts"
    - "src/state/appNavigation.ts"
    - "src/state/appTypes.ts"
  components:
    - "src/components/AppFrame.tsx"
    - "src/components/AppScreens.tsx"
    - "src/components/Banner.tsx"
    - "src/components/Panel.tsx"
    - "src/components/NavigationTabs.tsx"
    - "src/components/ConfirmDialog.tsx"
    - "src/components/RepoLauncher.tsx"
    - "src/components/OpsDeckScreen.tsx"
    - "src/components/WriterScreen.tsx"
    - "src/components/OutputScreen.tsx"
    - "src/components/StatusBar.tsx"
    - "src/components/AgentHelpModal.tsx"
  commands:
    - "src/commands/search.ts"
  types:
    - "src/types/profile.ts"
  utilities:
    - "src/utils/repo.ts"
    - "src/utils/profiles.ts"
    - "src/utils/packageScripts.ts"
    - "src/utils/markdown.ts"

architecture:
  canonical_layers:
    cli_boundary:
      purpose:
        - "Parse process-level inputs."
        - "Start the Ink app."
        - "Own top-level exit behavior."
      allowed:
        - "Import root app."
        - "Import Ink render API."
        - "Handle fatal boot errors."
      forbidden:
        - "Business logic."
        - "Screen-specific state."
        - "Filesystem workflows that belong in utilities."
        - "Scattered command orchestration."

    app_composition:
      purpose:
        - "Compose the root Ink tree."
        - "Wire controller state into frame and screens."
      allowed:
        - "Root-level layout."
        - "Controller hook usage."
        - "Global modals or overlays."
      forbidden:
        - "Low-level filesystem or process side effects."
        - "Large branching workflows better handled by controller or screens."

    controller_state:
      purpose:
        - "Own app state, transitions, selected screen, command state, modal state, repo/profile state, and derived UI state."
      preferred_patterns:
        - "Discriminated unions."
        - "Typed action dispatch."
        - "Pure transition helpers."
        - "Reducer-style updates where complexity grows."
      forbidden:
        - "Implicit state encoded in unrelated booleans."
        - "Untracked async mutation."
        - "Input handlers that mutate unrelated state without clear action names."

    screens:
      purpose:
        - "Render major app modes."
        - "Compose focused UI sections."
        - "Dispatch intentional controller actions."
      allowed:
        - "Screen-local presentation state."
        - "Screen-specific input mapping if scoped and non-conflicting."
      forbidden:
        - "Hidden global keyboard behavior."
        - "Direct process/file side effects when a utility/controller boundary should own them."

    reusable_components:
      purpose:
        - "Render composable TUI primitives."
      allowed:
        - "Props-driven Ink layout."
        - "Small presentation helpers."
      forbidden:
        - "App-level state mutation."
        - "Repo or filesystem reads."
        - "Business decisions."

    utilities:
      purpose:
        - "Provide isolated filesystem, repo, profile, package script, command, and formatting helpers."
      required_traits:
        - "Typed inputs."
        - "Typed outputs."
        - "Explicit error paths."
        - "Portable Windows/PowerShell behavior when relevant."

tui_design_laws:
  input:
    - "Centralize keyboard routing unless a component has a strong reason to own local input."
    - "Modal input always has priority over screen navigation."
    - "Text-entry mode must not accidentally trigger global shortcuts."
    - "Escape/back behavior must be predictable."
    - "Destructive actions require confirmation."
  layout:
    - "Design for terminal width variability."
    - "Avoid layout that relies on browser/CSS assumptions."
    - "Keep dense output scannable with panels, labels, and status rows."
    - "Make empty, loading, running, success, and error states visually distinct."
  rendering:
    - "Avoid re-render loops from effects that mutate state without stable guards."
    - "Avoid noisy timers unless the UI needs live progress."
    - "Keep long output bounded or scrollable by app convention."
  process:
    - "Long-running commands must expose running/error/success state."
    - "Prefer explicit cancellation or exit handling."
    - "Do not bury fatal errors in UI-only state."
  logs:
    - "Do not mix machine/agent logs with primary user output unless intentionally surfaced."
    - "Preserve `.agent-logs/events.jsonl` as append-oriented operational history unless asked otherwise."

typescript_contract:
  compiler_posture:
    - "Assume strict TypeScript."
    - "Preserve or improve type safety."
  required_patterns:
    - "Use discriminated unions for screens, task states, modal states, and command result states."
    - "Prefer readonly arrays/objects for configuration constants."
    - "Use `unknown` at unsafe boundaries, then narrow."
    - "Use typed result objects for fallible utilities."
  banned_patterns:
    - "Unjustified `any`."
    - "Stringly typed navigation where a union is available."
    - "Broad catch blocks that erase useful error information."
    - "Implicit mutation of shared state."

workflows:
  repo_analysis:
    steps:
      - "Inspect relevant files."
      - "Map current flow before proposing changes."
      - "Identify verified facts and uncertain assumptions."
      - "Name target files."
  implementation:
    steps:
      - "Make the smallest coherent change."
      - "Keep changes local to the correct layer."
      - "Update types before dependent code when needed."
      - "Validate with package scripts."
      - "Return changed files and execution-state update."
  refactor:
    steps:
      - "Preserve behavior first."
      - "Extract types/helpers only when they reduce complexity."
      - "Avoid speculative abstractions."
      - "Keep migration steps reversible."
  debugging:
    steps:
      - "Capture symptom."
      - "Trace from entrypoint to state transition to screen output."
      - "Check input routing and async lifecycle."
      - "Patch the narrowest failing edge."

acceptance_gates:
  before_claiming_done:
    - "Relevant files were inspected or limitation was stated."
    - "Change matches the canonical architecture layers."
    - "TypeScript compile path is considered."
    - "Validation command is run or explicitly recommended."
    - "Execution state is updated with factual task status."
  validation_commands_preference:
    - "Use scripts from `package.json` after reading it."
    - "If scripts cannot be read, recommend likely checks without pretending they exist."

anti_patterns:
  - "Putting business logic in `src/cli.ts`."
  - "Adding global `useInput` handlers inside unrelated leaf components."
  - "Using booleans like `isOpen`, `isBusy`, `isEditing`, `isConfirming` when a discriminated union would be safer."
  - "Letting async command output mutate UI state after the user navigated away without guards."
  - "Adding browser React patterns that do not fit Ink."
  - "Creating generic abstractions before the second concrete use case."
  - "Returning generic advice instead of file-specific implementation."

assistant_response_contract:
  concise_default: true
  implementation_response_shape:
    - "Target files"
    - "Change summary"
    - "Patch/code"
    - "Validation"
    - "Execution state update"
  audit_response_shape:
    - "Verified facts"
    - "Findings"
    - "Risk ranking"
    - "Patch plan"
    - "Execution state update"
  uncertainty_rule: "State uncertainty directly. Do not fabricate file contents or package versions."
